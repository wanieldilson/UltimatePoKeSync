name: Release

# Builds a ready-to-run download for every desktop platform and attaches it to the
# release. Nobody should need a .NET SDK, a clone, or a command line to use this app.
#
# Push a tag to trigger it:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-and-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test before publishing anything
        run: dotnet test --configuration Release

      # Self-contained: the .NET runtime travels with the app. Bigger download, but the
      # promise is "download and run", and asking for a runtime install breaks it.
      - name: Publish
        run: |
          set -euo pipefail
          # The build has to know which release it is, or it cannot tell whether a newer one
          # exists. Tags are v-prefixed and versions are not. See D-056.
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64; do
            dotnet publish src/UltimatePoKeSync.App \
              --configuration Release \
              --runtime "$rid" \
              -p:Version="$version" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none \
              --output "publish/$rid"
          done

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd publish/win-x64 && zip -r ../../artifacts/UltimatePoKeSync-windows-x64.zip .)
          (cd publish/linux-x64 && tar czf ../../artifacts/UltimatePoKeSync-linux-x64.tar.gz .)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-linux
          path: artifacts/*

  # macOS builds must be produced on macOS. Apple Silicon refuses to execute an unsigned
  # binary (the kernel kills it outright, and Finder reports the app as "damaged") and
  # `codesign` only exists here. The .NET SDK ad-hoc signs the apphost when it publishes
  # on macOS; the bundle is then signed as a whole.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for rid in osx-x64 osx-arm64; do
            dotnet publish src/UltimatePoKeSync.App \
              --configuration Release \
              --runtime "$rid" \
              -p:Version="$version" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none \
              --output "publish/$rid"
          done

      - name: Build the macOS icon
        run: ./build/make-icns.sh build/UltimatePoKeSync.icns

      # A bare Unix executable opens a Terminal window when double-clicked, so macOS gets
      # a real bundle.
      - name: Wrap in an app bundle and sign it
        run: |
          set -euo pipefail
          for rid in osx-x64 osx-arm64; do
            bundle="bundles/$rid/UltimatePoKeSync.app"
            mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
            cp -R "publish/$rid/." "$bundle/Contents/MacOS/"
            cp build/UltimatePoKeSync.icns "$bundle/Contents/Resources/"
            chmod +x "$bundle/Contents/MacOS/UltimatePoKeSync"
            cat > "$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>UltimatePoKeSync</string>
            <key>CFBundleDisplayName</key><string>UltimatePoKeSync</string>
            <key>CFBundleIdentifier</key><string>online.cazzeggia.ultimatepokesync</string>
            <key>CFBundleExecutable</key><string>UltimatePoKeSync</string>
            <key>CFBundleIconFile</key><string>UltimatePoKeSync</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
            sed -i '' 's/^          //' "$bundle/Contents/Info.plist"

            # Ad-hoc, because notarising needs a paid Apple Developer account. It is
            # enough to make the app runnable; Gatekeeper still asks for right-click ->
            # Open the first time.
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      # ditto, not zip: it preserves the symlinks and permissions a signature covers.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --keepParent bundles/osx-x64/UltimatePoKeSync.app \
            artifacts/UltimatePoKeSync-macos-intel.zip
          ditto -c -k --keepParent bundles/osx-arm64/UltimatePoKeSync.app \
            artifacts/UltimatePoKeSync-macos-apple-silicon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*

  release:
    needs: [windows-and-linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded -type f -exec mv {} artifacts/ \;
          ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Download the file for your system, unpack it and run it. No .NET install needed.

            | System | File |
            | ------ | ---- |
            | Windows | `UltimatePoKeSync-windows-x64.zip` |
            | macOS, Apple Silicon | `UltimatePoKeSync-macos-apple-silicon.zip` |
            | macOS, Intel | `UltimatePoKeSync-macos-intel.zip` |
            | Linux | `UltimatePoKeSync-linux-x64.tar.gz` |

            **macOS:** the app is signed ad-hoc, not by Apple, so the first launch must be
            right-click → Open → Open. After that it starts normally.

            The app tells you how to connect mGBA on your system. The bridge script it
            asks for ships inside the download, in `emulator-scripts/`.
